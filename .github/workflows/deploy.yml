name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check deploy secrets
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Set DEPLOY_HOST and DEPLOY_SSH_KEY secrets to enable deploys"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'

      - name: Configure SSH
        if: steps.preflight.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'ubuntu' }}
          ASSIST_DOMAIN: ${{ vars.ASSIST_DOMAIN }}
          ASSIST_QUIET: "1"
        run: ./deploy/push.sh "$DEPLOY_HOST" "$DEPLOY_USER" "$HOME/.ssh/deploy_key"
