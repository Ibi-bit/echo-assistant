name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements-dev.txt
      - run: pytest server/tests
      - run: ruff check server/app/intents.py server/app/search.py server/app/config.py server/app/main.py server/app/webconfig.py server/tests
