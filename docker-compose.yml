services:
  assistant:
    build: .
    container_name: assistant
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      # All interfaces by default so the tablet can reach it on the LAN.
      # For a Caddy-only deployment, change to "127.0.0.1:8765:8765".
      - "8765:8765"
    volumes:
      # Only Whisper's downloaded model is host state. Piper and wake-word
      # models stay in the image, so a fresh host works without a local copy.
      - ./server/models/whisper:/app/server/models/whisper
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

