services:
  assistant:
    build: .
    container_name: assistant
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      # Bind to localhost only when Caddy terminates TLS in front (see deploy/cloud.md).
      - "8765:8765"
    volumes:
      # Whisper caches its model here after the first request.
      - ./server/models:/app/server/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

